<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RuToSo</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1C5DA6">
<style>
:root{--blau:#1C5DA6;--gelb:#F5C330;--grund:#F3F6F9;--flaeche:#fff;--text:#16222E;--leise:#56677A;--linie:#DCE3EA;color-scheme:light;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--grund:#0E1822;--flaeche:#16232F;--text:#E8EEF4;--leise:#9AABBD;--linie:#263646;color-scheme:dark}}
body{margin:0;background:var(--grund);color:var(--text);line-height:1.55}
header{background:var(--blau);color:#fff;border-bottom:6px solid var(--gelb)}
.kopf{max-width:52rem;margin:0 auto;padding:2.4rem 1.25rem;display:flex;gap:1.2rem;align-items:center}
.kopf img{width:4.5rem;height:4.5rem;border-radius:1rem}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem)}
.kopf p{margin:.3rem 0 0;opacity:.9}
main{max-width:52rem;margin:0 auto;padding:2rem 1.25rem 3rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}
a.kachel{display:block;background:var(--flaeche);border:1px solid var(--linie);border-radius:1rem;padding:1.3rem;color:inherit;text-decoration:none}
a.kachel:hover,a.kachel:focus-visible{border-color:var(--blau);outline:none}
a.kachel h2{margin:0 0 .3rem;font-size:1.15rem}
a.kachel p{margin:0;color:var(--leise)}
a.kachel span{display:block;margin-top:.7rem;color:var(--blau);font-weight:600}
footer{max-width:52rem;margin:0 auto;padding:1rem 1.25rem 2rem;color:var(--leise);font-size:.9rem;display:flex;gap:1.2rem;flex-wrap:wrap}
footer a{color:inherit}
</style>
</head>
<body>
<header><div class="kopf"><img src="logo.svg" alt=""><div><h1>RuToSo</h1><p>Projekte und Apps aus eigener Werkstatt.</p></div></div></header>
<main>
  <a class="kachel" href="https://apps.rutoso.de"><h2>RuToSo-Apps</h2><p>Android-Apps und der RuToSo-AppStore zum Herunterladen.</p><span>apps.rutoso.de →</span></a>
  <a class="kachel" href="https://siegen-green.rutoso.de"><h2>SiegenGreen</h2><p>Webseite eines Schulprojekts: eine fiktive Vertical Farm aus Siegen-Wittgenstein.</p><span>siegen-green.rutoso.de →</span></a>
</main>
<footer><span>© RuToSo</span><a href="https://apps.rutoso.de/datenschutz.html">Datenschutz &amp; Impressum</a></footer>
</body>
</html>
